name: Release

# Publishes a GitHub release whenever the version in manifest.json changes on main.
# HACS and Home Assistant's update list work from releases, so bumping the version
# is all it takes to ship an update.

on:
  push:
    branches: [main]
    paths: [custom_components/bambu_timeline/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create a release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(jq -r .version custom_components/bambu_timeline/manifest.json)"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "$version is already released."
            exit 0
          fi
          gh release create "$version" --title "$version" --generate-notes --target "$GITHUB_SHA"
